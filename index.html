<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>90 Day Counter</title>
<style>
:root{
  --bg:#0b1426; --surface:#131f38; --ink:#e6edf7; --muted:#9fb0cc;
  --empty:#273858; --done:#2dd4bf; --done-ink:#06232a; --ring:#e8b04a;
  box-sizing:border-box; --cell:40px;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1426; --surface:#131f38; --ink:#e6edf7; --muted:#9fb0cc;
    --empty:#273858; --done:#2dd4bf; --done-ink:#06232a; --ring:#e8b04a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1426; --surface:#131f38; --ink:#e6edf7; --muted:#9fb0cc;
  --empty:#273858; --done:#2dd4bf; --done-ink:#06232a; --ring:#e8b04a;
  color-scheme:dark;
}
html{height:100%; overflow:hidden}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex; justify-content:center; align-items:center; height:100dvh; overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.hd{text-align:center; margin:0 0 10px}
.hd h1{margin:0; font-size:1.4rem; font-weight:700; letter-spacing:.01em}
.hd p{margin:6px 0 0; font-size:.85rem; color:var(--muted)}
main{width:100%; max-width:420px}
.bar{height:12px; border-radius:99px; background:var(--empty); margin:10px 0 0; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--done); border-radius:99px; transition:width .3s, background-size .3s}
.grid{background:var(--surface); border-radius:24px; padding:12px}
.row{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.row:last-child{margin-bottom:0}
.wk{width:22px; font-size:.7rem; color:var(--muted); text-align:right; flex:none}
.days{display:grid; grid-template-columns:repeat(7,var(--cell)); justify-content:space-between; flex:1}
.d{
  width:var(--cell); height:var(--cell); border-radius:50%; border:1.5px solid rgba(255,255,255,.35); box-sizing:border-box; padding:0; cursor:pointer;
  background:var(--empty); color:#ffffff; font-weight:600; font-size:calc(var(--cell)*.32); line-height:1; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:background .15s, transform .1s;
}
.d:active{transform:scale(.9)}
.d{-webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation}
.d:focus{outline:none}
.d.on{background:var(--done); color:var(--done-ink); border-color:rgba(255,255,255,.5)}
.d small{font-size:calc(var(--cell)*.2); font-weight:500; opacity:1}
.cnt{text-align:center; margin-top:8px; font-size:.95rem; font-weight:600; color:var(--muted)}
.clr{display:block; margin:10px auto 0; padding:8px 22px; border:1.5px solid var(--muted); border-radius:99px; background:none; color:var(--ink); font:inherit; font-size:.85rem; cursor:pointer}
.d.mile{border-color:rgba(232,176,74,.95)}
.dh{text-align:center; font-size:.7rem; font-weight:600; color:var(--muted)}
.d.today{outline:none; border-color:#ff3b3b; background:#2e4472; color:var(--ink); animation:rgbcycle 4s linear infinite}
@keyframes rgbcycle{0%{border-color:#ff3b3b}33%{border-color:#3bff6a}66%{border-color:#3b8cff}100%{border-color:#ff3b3b}}
.d svg{width:55%; height:55%}
.jb{display:block; margin:10px auto 0; padding:8px 22px; border:0; border-radius:99px; background:var(--done); color:var(--done-ink); font:inherit; font-size:.9rem; font-weight:600; cursor:pointer}
:focus-visible{outline:3px solid var(--ring); outline-offset:2px}
/* journal page */
.jp{position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto; display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.jp[hidden]{display:none}
.jpin{max-width:420px; width:100%; flex:1; min-height:0; margin:0 auto; display:flex; flex-direction:column; gap:12px}
#vEdit{flex:1; min-height:0}
#vList{flex:1; min-height:0}
.v p.ok{color:var(--done); font-weight:600; min-height:1.2em}
.jtop{position:relative; display:flex; align-items:center; justify-content:space-between; gap:8px}
.mn{position:absolute; right:0; top:calc(100% + 6px); z-index:5; min-width:190px; background:var(--surface); border:1px solid var(--empty); border-radius:14px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.mn button{display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink); font:inherit; font-size:.95rem; padding:11px 12px; border-radius:10px; cursor:pointer}
.mn button:active{background:var(--empty)}
#jlock{font-size:1.3rem; line-height:1; padding:6px 14px}
.jtop h2{margin:0; font-size:1.2rem; flex:1; text-align:center}
.tb{border:0; background:var(--empty); color:var(--ink); padding:8px 14px; border-radius:99px; font:inherit; font-size:.85rem; font-weight:600; cursor:pointer; min-width:64px}
.tb[hidden]{display:block!important; visibility:hidden}
[hidden]{display:none!important}
.v{display:flex; flex-direction:column; gap:10px}
.v p{margin:0; font-size:.9rem; color:var(--muted); line-height:1.45}
.v input,#jt{width:100%; border:1px solid var(--empty); border-radius:14px; padding:12px; font:inherit; font-size:1rem; background:var(--surface); color:var(--ink)}
#jt{flex:1; min-height:120px; resize:none; line-height:1.45}
.v select{width:100%; border:1px solid var(--empty); border-radius:14px; padding:12px; font:inherit; font-size:.9rem; background:var(--surface); color:var(--ink)}
.v p.q{color:var(--ink); font-weight:600}
.v input.pin{-webkit-text-security:disc; text-security:disc; letter-spacing:.25em}
.sv{display:flex; align-items:center; justify-content:space-between; gap:12px}
.sv span{font-size:.85rem; color:var(--done); font-weight:600; min-height:1.2em}
.sv .pb{padding:10px 28px}
.pb{padding:12px; border:0; border-radius:99px; background:var(--done); color:var(--done-ink); font:inherit; font-size:.95rem; font-weight:600; cursor:pointer}
.err{color:#c0392b!important; min-height:1.2em}
.ent{display:block; width:100%; text-align:left; background:var(--surface); border:0; border-radius:16px; padding:12px 14px; font:inherit; color:var(--ink); cursor:pointer}
.ent b{display:block; font-size:.85rem; margin-bottom:4px}
.ent span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--muted); font-size:.9rem; line-height:1.4}
.jh{display:flex; align-items:center; justify-content:space-between; gap:8px}
.jh button{border:0; background:var(--empty); color:var(--ink); width:38px; height:38px; border-radius:50%; font-size:1.3rem; line-height:1; cursor:pointer}
.jh button:disabled{opacity:.35}
.jh span{flex:1; text-align:center; font-weight:600; font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="hd"><h1>90 Days</h1><p id="sub"></p></header>
  <section class="grid" id="grid" aria-label="Days"></section>
  <button type="button" class="jb" id="jb">&#9998; Journal</button>
</main>
<div class="jp" id="jp" hidden>
  <div class="jpin">
    <div class="jtop">
      <button type="button" class="tb" id="jback">&lsaquo; Back</button>
      <h2>Journal</h2>
      <button type="button" class="tb" id="jlock" aria-label="Menu" hidden>&#8942;</button>
      <div class="mn" id="mn" hidden><button type="button" id="jchg">Change PIN</button><button type="button" id="jsq">Security questions</button></div>
    </div>
    <div class="v" id="vLock">
      <p id="lmsg"></p>
      <input type="text" class="pin" id="pw1" name="jcode1" placeholder="PIN" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <input type="text" class="pin" id="pw2" name="jcode2" placeholder="Confirm PIN" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" hidden>
      <p class="err" id="lerr"></p>
      <button type="button" class="pb" id="lgo"></button>
      <button type="button" class="clr" id="lreset" hidden>Forgot PIN?</button>
    </div>
    <div class="v" id="vList" hidden>
      <button type="button" class="pb" id="jnew">+ Write today</button>
      <div class="v" id="jlist"></div>
    </div>
    <div class="v" id="vPw" hidden>
      <p id="cpmsg">Change your journal PIN (4 to 8 digits). Your entries stay safe.</p>
      <input type="text" class="pin" id="cp1" name="jcode4" placeholder="New PIN" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <input type="text" class="pin" id="cp2" name="jcode5" placeholder="Confirm new PIN" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <p class="err" id="cperr"></p>
      <button type="button" class="pb" id="cpgo">Change PIN</button>
    </div>
    <div class="v" id="vSq" hidden>
      <p id="sqmsg"></p>
      <select id="sqs1" aria-label="Security question 1"></select>
      <input type="text" id="sqa1" name="jans1" placeholder="Answer 1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <select id="sqs2" aria-label="Security question 2"></select>
      <input type="text" id="sqa2" name="jans2" placeholder="Answer 2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <select id="sqs3" aria-label="Security question 3"></select>
      <input type="text" id="sqa3" name="jans3" placeholder="Answer 3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <p class="err" id="sqerr"></p>
      <button type="button" class="pb" id="sqgo">Save</button>
    </div>
    <div class="v" id="vFg" hidden>
      <p>Answer your security questions. Get at least 2 of 3 right to set a new PIN.</p>
      <p class="q" id="fgq1"></p>
      <input type="text" id="fga1" name="jfg1" placeholder="Answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <p class="q" id="fgq2"></p>
      <input type="text" id="fga2" name="jfg2" placeholder="Answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <p class="q" id="fgq3"></p>
      <input type="text" id="fga3" name="jfg3" placeholder="Answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
      <p class="err" id="fgerr"></p>
      <button type="button" class="pb" id="fggo">Verify</button>
    </div>
    <div class="v" id="vEdit" hidden>
      <div class="jh"><button type="button" id="jprev" aria-label="Previous day">&lsaquo;</button><span id="jdate"></span><button type="button" id="jnext" aria-label="Next day">&rsaquo;</button></div>
      <textarea id="jt" placeholder="How did today go?" aria-label="Journal entry"></textarea>
      <div class="sv"><span id="jst" aria-live="polite"></span><button type="button" class="pb" id="jsave">Save</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY="counter90:v2", TOTAL=90, MILES=[7,30,60,90], JOFF=5;
  var done=new Array(TOTAL).fill(false);
  try{
    var s=localStorage.getItem(KEY);
    if(s){var a=JSON.parse(s); if(Array.isArray(a)&&a.length===TOTAL) done=a.map(Boolean);}
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}
  // Day 1 is fixed to 9 Nov 2026 (restarted). Change the numbers below (year, month 0-11, day) to move it.
  var start=new Date(2026,10,9);
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function dateOf(i){return new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);}
  function lbl(i){var d=dateOf(i); return DAYN[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+(i>=0?" \u00b7 Day "+(i+1):"");}
  function todayIdx(){
    var n=new Date();
    var t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
    return Math.round((t-start)/86400000);
  }

  var grid=document.getElementById("grid"), btns=[];
  var check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var hrow=document.createElement("div"); hrow.className="row";
  var hlab=document.createElement("div"); hlab.className="wk";
  var hdays=document.createElement("div"); hdays.className="days";
  "SMTWTFS".split("").map(function(_,k,a){return a[(k+start.getDay())%7];}).forEach(function(l){var h=document.createElement("div"); h.className="dh"; h.textContent=l; hdays.appendChild(h);});
  hrow.appendChild(hlab); hrow.appendChild(hdays); grid.appendChild(hrow);
  for(var w=0; w*7<TOTAL; w++){
    var row=document.createElement("div"); row.className="row";
    var lab=document.createElement("div"); lab.className="wk"; lab.textContent="W"+(w+1);
    var days=document.createElement("div"); days.className="days";
    for(var c=0; c<7; c++){
      var i=w*7+c;
      if(i>=TOTAL){days.appendChild(document.createElement("div")); continue;}
      (function(i){
        var b=document.createElement("button"); b.className="d"; b.type="button";
        if(MILES.indexOf(i+1)>-1) b.classList.add("mile");
        var lt=null, lp=false;
        b.addEventListener("pointerdown",function(){lp=false; clearTimeout(lt); lt=setTimeout(function(){lp=true; openJournal(i);},500);});
        ["pointerup","pointerleave","pointercancel"].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(lt);});});
        b.addEventListener("contextmenu",function(e){e.preventDefault();});
        b.addEventListener("click",function(){ if(lp){lp=false; return;} if(i>todayIdx()) return; done[i]=!done[i]; save(); render();});
        days.appendChild(b); btns[i]=b;
      })(i);
    }
    row.appendChild(lab); row.appendChild(days); grid.appendChild(row);
  }
  var barEl=document.createElement("div"); barEl.className="bar"; barEl.setAttribute("role","progressbar");
  var fill=document.createElement("i"); barEl.appendChild(fill); grid.appendChild(barEl);
  var cnt=document.createElement("div"); cnt.className="cnt"; grid.appendChild(cnt);
  // TEMP clear button: delete this block and the .clr CSS rule to remove it (clears day marks only, not the journal)
  var clr=document.createElement("button"); clr.type="button"; clr.className="clr"; clr.textContent="Clear"; grid.appendChild(clr);
  var armed=false, tm;
  clr.addEventListener("click",function(){
    if(!armed){
      armed=true; clr.textContent="Tap again to clear";
      clearTimeout(tm); tm=setTimeout(function(){armed=false; clr.textContent="Clear";},3000);
    }else{
      armed=false; clearTimeout(tm); clr.textContent="Clear";
      done=new Array(TOTAL).fill(false); save(); render();
    }
  });

  function render(){
    var ti=todayIdx();
    for(var i=0;i<TOTAL;i++){
      btns[i].classList.toggle("today",i===ti&&!done[i]);
      if(i===ti) btns[i].setAttribute("aria-current","date"); else btns[i].removeAttribute("aria-current");
      btns[i].classList.toggle("on",done[i]);
      btns[i].classList.toggle("fut",i>ti);
      var dt=dateOf(i);
      btns[i].innerHTML=done[i]?check:"<span>"+dt.getDate()+"</span><small>"+MON[dt.getMonth()]+"</small>";
      btns[i].setAttribute("aria-label",dt.getDate()+" "+MON[dt.getMonth()]+(done[i]?", done":", not done"));
      btns[i].setAttribute("aria-pressed",done[i]);
    }
    var c=done.filter(Boolean).length;
    fill.style.width=(c/TOTAL*100)+"%";
    fill.style.backgroundImage="linear-gradient(90deg,#4f8cff 0%,#2dd4bf 100%)";
    fill.style.backgroundRepeat="no-repeat";
    fill.style.backgroundSize=(c?10000/(c/TOTAL*100):100)+"% 100%";
    cnt.textContent=c+" of "+TOTAL+" days";
    barEl.setAttribute("aria-valuenow",c); barEl.setAttribute("aria-valuemax",TOTAL);
    var s0=dateOf(0), s1=dateOf(TOTAL-1);
    document.getElementById("sub").textContent=s0.getDate()+" "+MON[s0.getMonth()]+" \u2013 "+s1.getDate()+" "+MON[s1.getMonth()];
  }

  /* ---------- Journal: separate page, password protected, encrypted on this device ---------- */
  var VK="counter90:jv2", OLDK="counter90:journal:v1", V3="counter90:jv3";
  var enc=new TextEncoder(), dec=new TextDecoder();
  var ckey=null, jr={}, cur=0, pending=null, saveT=null, pushed=false, resetMode=false, sqMode="", pendingPw="", pendingInit={}, fgFails=0;
  var $=function(id){return document.getElementById(id);};
  var jp=$("jp"), vLock=$("vLock"), vList=$("vList"), vEdit=$("vEdit"), ta=$("jt"), pw1=$("pw1"), pw2=$("pw2"), lerr=$("lerr"), lgo=$("lgo"), jlock=$("jlock");

  function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  function unb64(s){var t=atob(s),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a;}
  function derive(pw,salt){
    return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(m){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    });
  }
  function seal(k,text){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,enc.encode(text)).then(function(ct){return {iv:b64(iv),ct:b64(ct)};});
  }
  function unseal(k,o){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},k,unb64(o.ct)).then(function(p){return dec.decode(p);});
  }
  function readV(){try{return JSON.parse(localStorage.getItem(VK));}catch(e){return null;}}
  function readV3(){try{return JSON.parse(localStorage.getItem(V3));}catch(e){return null;}}
  function pinMode(){try{return localStorage.getItem("counter90:pm")==="1";}catch(e){return false;}}
  function setPinMode(){try{localStorage.setItem("counter90:pm","1");}catch(e){}}
  function persist(){
    clearTimeout(saveT);
    if(!ckey) return Promise.resolve();
    var v=readV3(); if(!v) return Promise.resolve();
    return seal(ckey,JSON.stringify(jr)).then(function(d){v.data=d; try{localStorage.setItem(V3,JSON.stringify(v));}catch(e){}});
  }
  function view(name){
    vLock.hidden=name!=="lock"; vList.hidden=name!=="list"; vEdit.hidden=name!=="edit"; $("vPw").hidden=name!=="pw"; $("vSq").hidden=name!=="sq"; $("vFg").hidden=name!=="fg";
    jlock.hidden=name!=="list"; $("mn").hidden=true;
  }
  function prepLock(){
    var has=!!(readV3()||readV());
    pw1.value=""; pw2.value=""; lerr.textContent="";
    pw2.hidden=has; $("lreset").hidden=!has;
    pw1.setAttribute("inputmode",(!has||pinMode())?"numeric":"text");
    $("lmsg").textContent=has?"Enter your PIN to open the journal.":"Create a PIN (4 to 8 digits) for your journal. Your entries stay on this phone.";
    lgo.textContent=has?"Unlock":"Create PIN";
    view("lock");
    if(!(window.crypto&&crypto.subtle)){lerr.textContent="The journal needs a secure (https) page to run."; lgo.disabled=true;} else lgo.disabled=false;
  }
  function showList(){
    var list=$("jlist"); list.innerHTML="";
    var ids=Object.keys(jr).filter(function(k){return jr[k]&&jr[k].trim();}).map(Number).sort(function(a,b){return b-a;});
    /* journal keys are days since 4 Nov, so old entries stay put; day index = key - JOFF */
    if(!ids.length){var p=document.createElement("p"); p.textContent="No entries yet."; list.appendChild(p);}
    ids.forEach(function(i){
      var b=document.createElement("button"); b.type="button"; b.className="ent";
      var h=document.createElement("b"); h.textContent=lbl(i-JOFF);
      var sp=document.createElement("span"); sp.textContent=jr[i];
      b.appendChild(h); b.appendChild(sp);
      b.addEventListener("click",function(){openEditor(i-JOFF);});
      list.appendChild(b);
    });
    view("list");
  }
  function openEditor(i){
    cur=Math.max(-JOFF,Math.min(TOTAL-1,i));
    $("jdate").textContent=lbl(cur);
    ta.value=jr[cur+JOFF]||""; $("jst").textContent="";
    $("jprev").disabled=cur===-JOFF; $("jnext").disabled=cur===TOTAL-1;
    view("edit");
  }
  function leaveEditor(){
    if(jr[cur+JOFF]!==undefined&&!jr[cur+JOFF].trim()) delete jr[cur+JOFF];
    return persist();
  }
  function lockNow(){
    ckey=null; jr={}; pending=null; pendingPw=""; pendingInit={}; ta.value=""; pw1.value=""; pw2.value="";
  }
  function closeJournal(){
    var p=ckey?leaveEditor():Promise.resolve();
    p.then(function(){lockNow(); jp.hidden=true; if(pushed){pushed=false; try{history.back();}catch(e){}}});
  }
  function openJournal(day){
    pending=(typeof day==="number")?day:null;
    jp.hidden=false;
    if(!pushed){try{history.pushState({j:1},""); pushed=true;}catch(e){}}
    if(ckey){ if(pending!==null) openEditor(pending); else showList(); }
    else prepLock();
  }
  function hashPin(pw,salt){
    return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]).then(function(m){
      return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},m,256);
    }).then(b64);
  }
  function impDK(s){return crypto.subtle.importKey("raw",unb64(s),{name:"AES-GCM"},false,["encrypt","decrypt"]);}
  /* the PIN is only a lock: entries are encrypted with a random key kept on the phone, so the PIN can be changed any time without losing entries */
  function newStore(pw,init,sq){
    var salt=crypto.getRandomValues(new Uint8Array(16)), raw=crypto.getRandomValues(new Uint8Array(32));
    return Promise.all([hashPin(pw,salt),impDK(b64(raw))]).then(function(r){
      return seal(r[1],JSON.stringify(init)).then(function(d){
        var o={salt:b64(salt),hash:r[0],dk:b64(raw),data:d}; if(sq) o.sq=sq; localStorage.setItem(V3,JSON.stringify(o));
        setPinMode(); return r[1];
      });
    });
  }
  lgo.addEventListener("click",function(){
    lerr.textContent="";
    var pw=pw1.value, v3=readV3(), v=readV();
    if(!pw){lerr.textContent="Enter your PIN."; return;}
    lgo.disabled=true;
    var job;
    if(v3){
      job=hashPin(pw,unb64(v3.salt)).then(function(h){
        if(h!==v3.hash) throw "bad";
        return impDK(v3.dk).then(function(k){return unseal(k,v3.data).then(function(txt){ckey=k; jr=JSON.parse(txt)||{};});});
      });
    }else if(v){
      job=derive(pw,unb64(v.salt)).then(function(k){
        return unseal(k,v.check).then(function(){return unseal(k,v.data);});
      }).then(function(txt){
        var data=JSON.parse(txt)||{};
        return newStore(pw,data).then(function(k){ckey=k; jr=data; try{localStorage.removeItem(VK);}catch(e){}});
      });
    }else{
      if(!/^\d{4,8}$/.test(pw)){lerr.textContent="Use 4 to 8 digits."; lgo.disabled=false; return;}
      if(pw!==pw2.value){lerr.textContent="PINs do not match."; lgo.disabled=false; return;}
      var init={};
      try{var old=JSON.parse(localStorage.getItem(OLDK)||"null"); if(old&&typeof old==="object") init=old;}catch(e){}
      pendingPw=pw; pendingInit=init; sqMode="create"; lgo.disabled=false; openSq(); return;
    }
    job.then(function(){
      lgo.disabled=false; pw1.value=""; pw2.value="";
      var vn=readV3();
      if(!vn||!vn.sq){sqMode="force"; openSq(); return;}
      if(pending!==null) openEditor(pending); else showList();
    }).catch(function(){
      lgo.disabled=false; lerr.textContent=(v3||v)?"Wrong PIN.":"Could not create the PIN.";
    });
  });
  [pw1,pw2].forEach(function(el){el.addEventListener("keydown",function(e){if(e.key==="Enter") lgo.click();});});
  function setSt(t){$("jst").textContent=t;}
  ta.addEventListener("input",function(){jr[cur+JOFF]=ta.value; setSt("Saving\u2026"); clearTimeout(saveT); saveT=setTimeout(function(){persist().then(function(){setSt("Saved \u2713");});},400);});
  $("jsave").addEventListener("click",function(){
    var sb=$("jsave"); sb.disabled=true; setSt("Saving\u2026");
    leaveEditor().then(function(){
      setSt("Saved \u2713"); sb.textContent="Saved \u2713";
      setTimeout(function(){sb.disabled=false; sb.textContent="Save"; if(!vEdit.hidden){setSt(""); showList();}},700);
    });
  });
  $("jprev").addEventListener("click",function(){leaveEditor().then(function(){openEditor(cur-1);});});
  $("jnext").addEventListener("click",function(){leaveEditor().then(function(){openEditor(cur+1);});});
  $("jnew").addEventListener("click",function(){var t=todayIdx(); openEditor(t<0?0:t);});
  $("jback").addEventListener("click",function(){
    if(!vEdit.hidden){leaveEditor().then(showList);} else if(!$("vPw").hidden||!$("vSq").hidden||!$("vFg").hidden){backInner();} else closeJournal();
  });
  window.addEventListener("popstate",function(){
    if(jp.hidden) return;
    pushed=false;
    if(!vEdit.hidden||!$("vPw").hidden||!$("vSq").hidden||!$("vFg").hidden){
      (vEdit.hidden?Promise.resolve():leaveEditor()).then(function(){backInner(); try{history.pushState({j:1},""); pushed=true;}catch(e){}});
    } else closeJournal();
  });
  var cp1=$("cp1"), cp2=$("cp2"), cperr=$("cperr");
  function openChg(){
    resetMode=false;
    $("cpmsg").textContent="Set a new journal PIN (4 to 8 digits). Your entries stay safe."; $("cpgo").textContent="Change PIN";
    cp1.value=""; cp2.value=""; cperr.textContent=""; cperr.className="err"; view("pw");
  }
  function openReset(){
    resetMode=true;
    $("cpmsg").textContent=readV3()?"Set a new journal PIN (4 to 8 digits). You do not need the old one. Your entries stay.":"Set a new journal PIN (4 to 8 digits). You do not need the old one. Your old entries stay locked, because only the old PIN can open them."; $("cpgo").textContent="Set new PIN";
    cp1.value=""; cp2.value=""; cperr.textContent=""; cperr.className="err"; view("pw");
  }
  $("jchg").addEventListener("click",openChg);
  var SQS=["What was the name of your first school?","What is your mother\u2019s maiden name?","What was the name of your first pet?","What town were you born in?","What was your childhood nickname?","What was your first phone model?","Who was your best friend in primary school?","What was the first car you remember in your family?"];
  function nrm(a){return String(a).toLowerCase().replace(/\s+/g," ").trim();}
  function fillSel(){[1,2,3].forEach(function(n){var el=$("sqs"+n); if(!el.options.length){SQS.forEach(function(q){var o=document.createElement("option"); o.value=q; o.textContent=q; el.appendChild(o);}); el.selectedIndex=n-1;}});}
  function openSq(){
    fillSel(); [1,2,3].forEach(function(n){$("sqa"+n).value="";}); $("sqerr").textContent="";
    $("sqmsg").textContent=(sqMode==="force"?"Set up your security questions to continue. ":"")+"Choose 3 security questions. If you forget your PIN, 2 correct answers out of 3 let you set a new one. Answers are not case sensitive.";
    view("sq");
  }
  function sqBack(){ if(sqMode==="force"){lockNow(); prepLock();} else if(sqMode==="edit") showList(); else {pendingPw=""; pendingInit={}; prepLock();} }
  function backInner(){
    if(!$("vFg").hidden) prepLock();
    else if(!$("vSq").hidden) sqBack();
    else if(resetMode&&!$("vPw").hidden){resetMode=false; prepLock();}
    else showList();
  }
  $("sqgo").addEventListener("click",function(){
    var qs=[], as=[], n, er=$("sqerr"); er.textContent="";
    for(n=1;n<=3;n++){qs.push($("sqs"+n).value); as.push(nrm($("sqa"+n).value));}
    if(qs.filter(function(q,i){return qs.indexOf(q)===i;}).length<3){er.textContent="Pick 3 different questions."; return;}
    if(as.some(function(a){return a.length<2;})){er.textContent="Answer all three questions."; return;}
    var go=$("sqgo"); go.disabled=true;
    var salt=crypto.getRandomValues(new Uint8Array(16));
    Promise.all(as.map(function(a,i){return hashPin(i+":"+a,salt);})).then(function(h){
      var sq={q:qs,salt:b64(salt),h:h};
      if(sqMode==="edit"||sqMode==="force"){
        var v=readV3(); if(!v) throw 0;
        v.sq=sq; localStorage.setItem(V3,JSON.stringify(v));
        go.disabled=false; showList(); return;
      }
      return newStore(pendingPw,pendingInit,sq).then(function(k){
        go.disabled=false;
        try{localStorage.removeItem(OLDK);}catch(e){}
        if(sqMode==="create"){ckey=k; jr=pendingInit; pendingPw=""; if(pending!==null) openEditor(pending); else showList();}
        else {pendingPw=""; pendingInit={}; prepLock(); lerr.textContent="New PIN set. Enter it to unlock.";}
      });
    }).catch(function(){go.disabled=false; er.textContent="Could not save. Try again.";});
  });
  $("jsq").addEventListener("click",function(){sqMode="edit"; openSq();});
  function forgotPin(){
    var v3=readV3();
    if(!v3){ openReset(); return; }
    if(!v3.sq){ lerr.textContent="No security questions were set yet. Unlock once with your PIN and set them first."; return; }
    [1,2,3].forEach(function(n){$("fgq"+n).textContent=v3.sq.q[n-1]; $("fga"+n).value="";});
    $("fgerr").textContent=""; view("fg");
  }
  $("fggo").addEventListener("click",function(){
    var v3=readV3(), er=$("fgerr"), go=$("fggo"); er.textContent="";
    if(!v3||!v3.sq) return;
    if(fgFails>=5){er.textContent="Too many tries. Wait a minute."; return;}
    go.disabled=true;
    var salt=unb64(v3.sq.salt);
    Promise.all([1,2,3].map(function(n){return hashPin((n-1)+":"+nrm($("fga"+n).value),salt);})).then(function(h){
      var ok=0; h.forEach(function(x,i){if(x===v3.sq.h[i]) ok++;});
      go.disabled=false;
      if(ok>=2){fgFails=0; openReset();}
      else{fgFails++; er.textContent="Not enough correct answers."; if(fgFails>=5) setTimeout(function(){fgFails=0;},60000);}
    }).catch(function(){go.disabled=false; er.textContent="Something went wrong.";});
  });
  $("lreset").addEventListener("click",forgotPin);
  $("cpgo").addEventListener("click",function(){
    cperr.className="err"; cperr.textContent="";
    var v=readV3(), n=cp1.value;
    if(!ckey&&!resetMode) return;
    if(!/^\d{4,8}$/.test(n)){cperr.textContent="Use 4 to 8 digits."; return;}
    if(n!==cp2.value){cperr.textContent="New PINs do not match."; return;}
    if(!v){pendingPw=n; pendingInit={}; sqMode="fresh"; openSq(); return;}
    var go=$("cpgo"); go.disabled=true;
    var salt=crypto.getRandomValues(new Uint8Array(16));
    (v?hashPin(n,salt).then(function(h){
      v.salt=b64(salt); v.hash=h;
      localStorage.setItem(V3,JSON.stringify(v)); setPinMode();
    }):newStore(n,{}).then(function(){})).then(function(){
      resetMode=false; cp1.value=""; cp2.value="";
      cperr.className="ok"; cperr.textContent="PIN changed successfully \u2713";
      setTimeout(function(){go.disabled=false; cperr.textContent=""; cperr.className="err"; if(ckey) showList(); else prepLock();},1000);
    }).catch(function(){
      go.disabled=false; cperr.className="err";
      cperr.textContent="Could not change the PIN.";
    });
  });
  jlock.addEventListener("click",function(e){e.stopPropagation(); $("mn").hidden=!$("mn").hidden;});
  document.addEventListener("click",function(){$("mn").hidden=true;});
  $("jb").addEventListener("click",function(){openJournal();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!jp.hidden) $("jback").click();});

  function fit(){
    var main=document.querySelector("main"), cs=getComputedStyle(document.body);
    var avail=document.body.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var inner=Math.min(document.body.clientWidth-32,420)-24-30;
    var cell=Math.min(56,Math.floor((inner-30)/7));
    for(;cell>18;cell--){
      document.documentElement.style.setProperty("--cell",cell+"px");
      if(main.offsetHeight<=avail) break;
    }
  }
  /* default PIN for the artifact: on a fresh browser with no journal yet, create it with PIN 0000 */
  (function(){
    if(readV3()||readV()||!(window.crypto&&crypto.subtle)) return;
    var init={};
    try{var old=JSON.parse(localStorage.getItem(OLDK)||"null"); if(old&&typeof old==="object") init=old;}catch(e){}
    newStore("0000",init).then(function(){try{localStorage.removeItem(OLDK);}catch(e){}}).catch(function(){});
  })();
  render(); fit();
  window.addEventListener("resize",fit);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ if(!jp.hidden) closeJournal(); }
    else { render(); fit(); }
  });
})();
</script>
